spring.application.name=smart-pg-backend

# =============================================================================
# DataSource - PostgreSQL Connection
# =============================================================================
# Required Environment Variables:
# DB_URL (e.g., jdbc:postgresql://localhost:5432/smartpg_db)
# DB_USERNAME (e.g., postgres)
# DB_PASSWORD (e.g., your-db-password)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =============================================================================
# JPA / Hibernate Configuration
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =============================================================================
# Flyway Configuration
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =============================================================================
# JWT Configuration
# =============================================================================
# Required Environment Variable:
# JWT_SECRET (must be at least 256 bits / 32 chars)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-days=30

# =============================================================================
# Brute-Force Protection Configuration
# =============================================================================
security.max-failed-logins=5
security.failed-login-window-minutes=15

# =============================================================================
# Logging
# =============================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.smartpg=DEBUG

# =============================================================================
# Server
# =============================================================================
server.port=8080
