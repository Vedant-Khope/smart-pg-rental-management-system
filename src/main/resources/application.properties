spring.application.name=smart-pg-backend

# =============================================================================
# DataSource - PostgreSQL Connection
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartpg_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP - Spring Boot's default, production-grade)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =============================================================================
# JPA / Hibernate Configuration
# =============================================================================
# validate = Hibernate checks entity classes match the DB schema, does NOT
#            create or alter tables. Flyway handles all DDL.
spring.jpa.hibernate.ddl-auto=validate

# Show SQL queries in console - great for dev debugging. Turn off in prod.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# open-in-view=false: prevents accidental lazy-loading outside transactions
spring.jpa.open-in-view=false

# =============================================================================
# Flyway Configuration
# =============================================================================
# Flyway runs scripts automatically on app startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =============================================================================
# JWT Configuration
# =============================================================================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-days=30

# =============================================================================
# Brute-Force Protection Configuration
# =============================================================================
security.max-failed-logins=5
security.failed-login-window-minutes=15

# =============================================================================
# Logging (development only - reduce in production)
# =============================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.smartpg=DEBUG

# =============================================================================
# Server
# =============================================================================
server.port=8080
